    <!-- Meta Pixel é injetado dinamicamente após consentimento LGPD (ver CookieConsent.tsx) -->
    <style>
      .lovable-badge, .lovable-watermark, #lovable-badge, #lovable-root, #lovable-floating-button,
      .lovable-floating-button, [id*="lovable"], [class*="lovable"], .button-lovable, .edit-with-lovable {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
    </style>

    <script>
      (function() {
        const hideLovable = () => {
          const nodes = Array.from(document.querySelectorAll('div, a, button, span, iframe'));
          nodes.forEach(el => {
            try {
              const t = (el.textContent || '').toLowerCase();
              const id = (el.id || '').toLowerCase();
              const cl = (el.className || '').toString().toLowerCase();
              const aria = (el.getAttribute('aria-label') || '').toLowerCase();
              if (id.includes('lovable') || cl.includes('lovable') || aria.includes('lovable') || t.includes('lovable')) {
                el.style.display = 'none';
                el.style.visibility = 'hidden';
                el.style.opacity = '0';
                el.style.pointerEvents = 'none';
              }
            } catch(e) {}
          });
        };
        hideLovable();
        const obs = new MutationObserver(hideLovable);
        obs.observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>

    <script>
      // Função segura para React que roda periodicamente para garantir que
      // os links sejam atualizados mesmo após animações ou navegação entre páginas.
      setInterval(function() {
        var referralId = window.promotekit_referral;
        if (referralId) {
          document.querySelectorAll('a[href^="https://buy.stripe.com/"]').forEach(function(link) {
            var oldUrl = link.getAttribute("href");
            if (!oldUrl.includes("client_reference_id")) {
              var separator = oldUrl.includes("?") ? "&" : "?";
              link.setAttribute("href", oldUrl + separator + "client_reference_id=" + referralId);
            }
          });
        }
      }, 2000); // Verifica a cada 2 segundos
    </script>
